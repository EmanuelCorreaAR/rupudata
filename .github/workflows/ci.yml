name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  package:
    name: Build + clean install smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Clean-env install from wheel
        run: |
          python -m venv /tmp/rupudata-smoke
          /tmp/rupudata-smoke/bin/pip install dist/rupudata-*-py3-none-any.whl
          /tmp/rupudata-smoke/bin/rupudata --help

      - name: Smoke compare + benchmark-check
        run: |
          /tmp/rupudata-smoke/bin/rupudata compare examples/train.jsonl examples/eval.jsonl -o /tmp/compare.json
          /tmp/rupudata-smoke/bin/rupudata benchmark-check examples/train_with_gsm8k_overlap.jsonl --benchmark gsm8k -o /tmp/bench.json
          test -f /tmp/compare.json
          test -f /tmp/bench.json
