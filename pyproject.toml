[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rupudata"
version = "0.4.0"
description = "Open-source, local-first CLI for inspecting and auditing datasets used in AI workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Emanuel Correa" }]
keywords = ["datasets", "ai", "audit", "cli", "deduplication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
rupudata = "rupudata.cli:app"

[project.urls]
Homepage = "https://github.com/EmanuelCorreaAR/rupudata"
Repository = "https://github.com/EmanuelCorreaAR/rupudata"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
